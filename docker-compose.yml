version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: hostel_marketplace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostel_user
      POSTGRES_PASSWORD: hostel_pass
      POSTGRES_DB: hostel_marketplace
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
